<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#06101c"
    >

    <title>
        BloomXR — The Lotus Sanctuary
    </title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;

            overflow: hidden;

            background:
                #06101c;

            font-family:
                Inter,
                Arial,
                sans-serif;
        }

        body {
            position: relative;
        }

        canvas {
            display: block;
        }

        button,
        input {
            font-family: inherit;
        }

        /* Hide WebXR button until it is inserted by Three.js. */
        .webxr-button {
            position: fixed !important;

            right: 18px !important;
            top: 18px !important;
            left: auto !important;
            bottom: auto !important;

            z-index: 6000 !important;
        }
    </style>
</head>

<body>

    <script type="module">
        import "./src/main.js";
    </script>

</body>
</html>
